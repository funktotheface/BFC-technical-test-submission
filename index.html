<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blackpool Courses</title>
    <link rel="stylesheet" href="style.css">
    <style>

    </style>
</head>

<body>
    <header>
        <div class="header-inner">
            <div class="brand">
                Blackpool Courses</div>

        </div>
    </header>
    <section class="hero">
        <div class="hero-inner">
            <h1>Find a course</h1>
            <p>Discover your next step with Courses in Blackpool.</p>
        </div>
    </section>
    <main>
        <div class="content">
            <section class="search-panel">
                <h2>What would you like to study?</h2>
                <div class="search-row"><input id="search" type="search"
                        placeholder="Search by course name or keyword"><button id="searchButton" class="btn">Search
                        courses</button>
                </div>
                <p id="results-counter">
                    0 courses found
                </p>
                <div class="filters">

                    <div>
                        <label for="level-filter">
                            Qualification level
                        </label>

                        <select id="level-filter">
                            <option value="all">
                                All levels
                            </option>
                        </select>
                    </div>


                    <div>
                        <label for="type-filter">
                            Qualification type
                        </label>

                        <select id="type-filter">
                            <option value="all">
                                All types
                            </option>
                        </select>
                    </div>


                    <div>
                        <label for="subject-filter">
                            Subject
                        </label>

                        <select id="subject-filter">
                            <option value="all">
                                All subjects
                            </option>
                        </select>
                    </div>

                </div>
                <div class="sort-control">

                    <label for="sort">
                        Sort by
                    </label>

                    <select id="sort">

                        <option value="title-asc">
                            Course title A–Z
                        </option>

                        <option value="title-desc">
                            Course title Z–A
                        </option>

                        <option value="level-asc">
                            Level low to high
                        </option>

                        <option value="level-desc">
                            Level high to low
                        </option>

                        <option value="date-asc">
                            Start date earliest
                        </option>

                        <option value="date-desc">
                            Start date latest
                        </option>

                    </select>

                </div>
            </section>
            <div id="no-results" hidden>

                <h2>No courses found</h2>

                <p>
                    Try changing your search term or filters.
                </p>

            </div>
            <section>
                <div id="courses">loading courses... </div>
            </section>

            <div id="pagination" aria-label="Course results pages"></div>
        </div>
    </main>
    <footer>
        <div class="footer-inner"><strong>Blackpool Courses</strong></div>
    </footer>
    <script src="courses.js"></script>
    <script src="app.js"></script>
</body>

</html>
